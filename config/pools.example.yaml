# Copy to config/pools.yaml (not committed) and fill in.
# Points per stat. Any stat not listed counts for 0.
# Skater stat keys: goals, assists, points, plus_minus, pim, ppp, shp, gwg, shots, hits, blocks, fow
# Goalie stat keys: wins, losses, ot_losses, saves, goals_against, shutouts

pools:
  - id: yahoo_famille
    name: "Pool Yahoo famille"
    source: yahoo
    league_id: "133321"       # hockey.fantasysports.yahoo.com/hockey/133321/1
    team_id: 1                # your team number in the league
    # Scoring is read from Yahoo's league settings. Override here only if needed.

  - id: poolexpert
    name: "PoolExpert – LesEntrepotsAB"
    source: poolexpert
    pool_id: 188663
    entry_id: 2289042
    free_agents_allowed: true
    note: "The pool administrator makes all roster changes: send suggested moves to the admin."
    # From grules.aspx. Forwards and defense score the same.
    # Not modelled yet: OT goals/assists, OT/SO wins, SO losses and goals, hat tricks,
    # player of the week/month, goalie goals (15) and assists (5), team slot.
    scoring:
      skater:
        goals: 2
        assists: 1
        plus_minus: 0.5
        ppp: 1        # 1 bonus per PP goal and per PP assist
        shp: 1        # 1 bonus per SH goal and per SH assist
        gwg: 1
      goalie:
        wins: 2
        ot_losses: 1
        shutouts: 3
