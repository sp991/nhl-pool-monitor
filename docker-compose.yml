# TrueNAS: Apps > Discover Apps > ⋮ > Install via YAML, then paste this file.
# Data lives in the Main/nhl-pool-monitor dataset (included in the Backblaze cloud sync of /mnt/Main).
services:
  collector:
    image: ghcr.io/sp991/nhl-pool-monitor:latest
    restart: unless-stopped
    environment:
      TZ: America/Toronto
      YAHOO_CONSUMER_KEY: ${YAHOO_CONSUMER_KEY:-}
      YAHOO_CONSUMER_SECRET: ${YAHOO_CONSUMER_SECRET:-}
      POOLEXPERT_EMAIL: ${POOLEXPERT_EMAIL:-}
      POOLEXPERT_PASSWORD: ${POOLEXPERT_PASSWORD:-}
    volumes:
      - /mnt/Main/nhl-pool-monitor/data:/data
      - /mnt/Main/nhl-pool-monitor/config:/config:ro
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  dashboard:
    image: ghcr.io/sp991/nhl-pool-monitor:latest
    restart: unless-stopped
    command: ["streamlit", "run", "app/dashboard.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    environment:
      TZ: America/Toronto
      PYTHONPATH: /srv
    ports:
      - "30050:8501"
    volumes:
      - /mnt/Main/nhl-pool-monitor/data:/data:ro
      - /mnt/Main/nhl-pool-monitor/config:/config:ro
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Pulls new images pushed by GitHub Actions and restarts the two services above.
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    command: ["--label-enable", "--cleanup", "--interval", "600"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
